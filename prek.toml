[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "check-added-large-files" },
    { id = "end-of-file-fixer" },
    { id = "check-toml" },
    { id = "check-merge-conflict" },
    { id = "no-commit-to-branch", "branch" = "main" },
]

[[repos]]
repo = "https://github.com/jolars/panache-pre-commit"
rev = "v3.11.0"
hooks = [{ id = "panache-format" }]
